[project]
name = "flowops-api"
version = "0.1.0"
description = "FlowOps API: incident management and prioritization"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic[email]>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: tests that need a running PostgreSQL (DATABASE_URL)"]

[tool.ruff.lint.isort]
# backend/alembic/ (our migrations folder) shadows the installed `alembic` package, so ruff
# would otherwise classify `from alembic import ...` as a first-party import.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# conftest must set TEST_DATABASE_URL before the app (and its settings) are imported.
"tests/conftest.py" = ["E402", "I001"]
"tests/*" = ["E501"]
"alembic/versions/*" = ["E501"]

[[tool.mypy.overrides]]
# The Starlette TestClient is not fully typed in this environment, so its results come
# back as Any. Strictness stays on for the application code; tests only relax this rule.
module = ["tests.*"]
warn_return_any = false
